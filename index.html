<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RightWay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  body { width: 100vw; height: 100dvh; }
  body { font-family: 'Inter', sans-serif; background: #020617; color: #f8fafc; overflow: hidden; touch-action: none; margin: 0; }
  canvas { display: block; image-rendering: pixelated; }
  @keyframes pulse-border {
    0%, 100% { border-color: rgba(239,68,68,.8); box-shadow: 0 0 15px rgba(239,68,68,.5); }
    50% { border-color: rgba(239,68,68,.3); box-shadow: 0 0 5px rgba(239,68,68,.2); }
  }
  .ring-alert { animation: pulse-border 1.2s infinite; }
</style>
</head>
<body class="flex items-center justify-center">
  <div id="game-container" class="relative w-full h-full max-w-[1280px] max-h-[720px] bg-slate-900 shadow-2xl overflow-hidden md:rounded-2xl border border-slate-800">
    <canvas id="gameCanvas" class="w-full h-full"></canvas>

    <div id="ui-overlay" class="absolute inset-0 flex flex-col justify-center items-center p-4"></div>

    <div id="touch-controls" class="absolute inset-0 pointer-events-none flex-col justify-between p-4 z-20" style="display:none">
      <div class="flex justify-end pointer-events-auto">
        <button id="btn-touch-action" class="bg-blue-600 text-white font-bold py-3 px-5 rounded-xl shadow-lg border border-blue-400 active:scale-95 transition text-lg">[E]</button>
      </div>
      <div class="flex justify-between items-end">
        <div id="joystick-zone" class="pointer-events-auto w-36 h-36 bg-slate-800/60 rounded-full border-2 border-slate-600/50 flex items-center justify-center" style="touch-action:none">
          <div id="joystick-knob" class="w-14 h-14 bg-blue-500/80 rounded-full border-2 border-blue-300 shadow-md"></div>
        </div>
        <button id="btn-touch-phone" class="pointer-events-auto bg-amber-600 text-white font-bold py-3 px-5 rounded-xl shadow-lg border border-amber-400 active:scale-95 transition" style="display:none">📞 [T]</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
